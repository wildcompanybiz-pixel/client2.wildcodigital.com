<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Art’Us &amp; Usages — Propositions de page d’accueil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600&family=Source+Sans+3:wght@400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#F3EEE4;color:#1F3D33;font-family:'Source Sans 3',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:960px;min-height:100vh;margin:0 auto;padding:48px 16px;display:flex;flex-direction:column;justify-content:center;gap:40px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:20px}
.card{display:flex;align-items:center;justify-content:center;min-height:200px;padding:28px;border-radius:24px;text-decoration:none;font-family:Outfit,sans-serif;font-weight:600;font-size:clamp(22px,3vw,28px);letter-spacing:.18em;text-transform:uppercase;border:1.5px solid transparent;transition:border-color .15s,transform .15s}
.card:hover{border-color:#C2643A;transform:translateY(-2px)}
.a{background:#FBF8F2;color:#C2643A}
.b{background:#1F3D33;color:#D9A55A}
footer{text-align:center;font-size:13px;opacity:.6}
</style>
</head>
<body>
<main>
  <div class="grid">
    <a class="card a" href="proposition-a/">Proposition A</a>
    <a class="card b" href="proposition-b/">Proposition B</a>
  </div>
  <footer>Réalisé par Wild Company</footer>
</main>
</body>
</html>
